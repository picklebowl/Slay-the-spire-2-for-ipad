name: Build Windows iPad assistant
on:
  push:
    branches: [main]
    paths:
      - 'windows-assistant/**'
      - '.github/workflows/build-assistant.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  statuses: write
jobs:
  build:
    if: github.event.repository.private == true
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish run link
        run: python windows-assistant/report_status.py pending
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: oven-sh/setup-bun@v2
      - name: Prepare audited signing source
        shell: pwsh
        run: |
          git clone https://github.com/nab138/iloader.git assistant-source
          git -C assistant-source checkout dc396af059fd46982062cd8fc90252d7e27085e9
          python windows-assistant/apply_fork.py assistant-source
          if ($LASTEXITCODE -ne 0) { throw 'Upstream patch failed' }
      - name: Cache native signing dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: assistant-source/src-tauri -> target
          cache-on-failure: true
      - name: Download validated private game build
        shell: pwsh
        run: |
          gh release download game-build-v0.111.0 --repo $env:GITHUB_REPOSITORY --pattern 'StS2-iPad-unsigned.ipa' --pattern 'cs_paths.txt' --dir ipa-input 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh run download 38117720910 --repo $env:GITHUB_REPOSITORY --name StS2-iPad-unsigned --dir ipa-input
            if ($LASTEXITCODE -ne 0) { throw 'Validated IPA artifact unavailable; no unverified substitute is allowed' }
          }
      - name: Run USB and data safety tests
        run: python -m unittest discover -s windows-assistant/tests -v
      - name: Install native build prerequisites
        run: choco install strawberryperl make --no-progress -y
      - name: Build isolated client payload
        run: python windows-assistant/build_package.py --source assistant-source --ipa-dir ipa-input
      - name: Compile frontend and Windows installer
        working-directory: assistant-source
        run: |
          bun install --frozen-lockfile
          bun run tauri build --bundles nsis
      - name: Stage portable bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item -LiteralPath assistant-source/src-tauri/target/release/iloader.exe -Destination 'package/StS2-iPad-Assistant.exe'
          Copy-Item -LiteralPath assistant-source/payload -Destination package/payload -Recurse
          Copy-Item -LiteralPath windows-assistant/START-HERE.md -Destination 'package/开始使用.md'
          Compress-Archive -Path package/* -DestinationPath StS2-iPad-Assistant-portable.zip
          $installer = Get-ChildItem assistant-source/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item -LiteralPath $installer.FullName -Destination StS2-iPad-Assistant-Setup.exe
          Get-FileHash -Algorithm SHA256 -LiteralPath StS2-iPad-Assistant-Setup.exe,StS2-iPad-Assistant-portable.zip | ForEach-Object { $_.Hash.ToLowerInvariant() + '  ' + (Split-Path -Leaf $_.Path) } | Set-Content -Encoding utf8 SHA256SUMS.txt
      - name: Upload assistant package
        uses: actions/upload-artifact@v4
        with:
          name: StS2-iPad-Windows-Assistant
          path: |
            StS2-iPad-Assistant-Setup.exe
            StS2-iPad-Assistant-portable.zip
            SHA256SUMS.txt
          retention-days: 90
          if-no-files-found: error
      - name: Publish private download page
        shell: pwsh
        run: |
          gh release view game-build-v0.111.0 --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create game-build-v0.111.0 --repo $env:GITHUB_REPOSITORY --target main --title '已验证的私有游戏构建 v0.111.0' --prerelease --notes '仅用于助手打包；游戏 IPA 原始构建为 ae02eef29f48a8ed142f0c2fc1469673565993ce，打包前验证固定 SHA256。不得公开。'
            if ($LASTEXITCODE -ne 0) { throw 'Private build release creation failed' }
          }
          gh release upload game-build-v0.111.0 ipa-input/StS2-iPad-unsigned.ipa ipa-input/cs_paths.txt --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Private build preservation failed' }
          $current = gh api "repos/$env:GITHUB_REPOSITORY/commits/main" --jq .sha
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify release source revision' }
          if ($current.Trim() -ne $env:GITHUB_SHA) {
            Write-Output 'Newer source exists; keeping this build as an artifact without replacing the current release.'
            exit 0
          }
          gh release view assistant-v0.1.1 --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create assistant-v0.1.1 --repo $env:GITHUB_REPOSITORY --target main --title 'iPad 安装与续签助手 v0.1.1' --notes-file windows-assistant/START-HERE.md --latest
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload assistant-v0.1.1 StS2-iPad-Assistant-Setup.exe StS2-iPad-Assistant-portable.zip SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
      - name: Publish final status
        if: always()
        run: python windows-assistant/report_status.py '${{ job.status }}'
