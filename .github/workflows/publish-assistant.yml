name: Publish verified Windows assistant
on:
  workflow_run:
    workflows: ['Build Windows iPad assistant']
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-assistant.yml'
      - '.github/scripts/publish_assistant_release.py'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Completed assistant build run ID (empty selects latest completed build)'
        required: false
        type: string
permissions:
  contents: write
  actions: read
  statuses: write
concurrency:
  group: publish-windows-assistant
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.repository.private == true && (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main')
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish checksum-verified package without recompiling
        run: python .github/scripts/publish_assistant_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assistant-release-verification
          path: publish-result.json
          if-no-files-found: ignore
          retention-days: 90
